name: Signed release AAB verify (no publish)

# Manual-dispatch-only workflow that builds the release AAB signed with the
# real Play upload key and verifies the signature fingerprint. It never
# uploads to Play and never publishes a release. Artifact kept for 1 day.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-aab:
    name: Build and verify Play-signed AAB (artifact only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Decode Play upload keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release AAB
        run: gradle :androidApp:bundleRelease
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Verify AAB signature matches Play upload key fingerprint
        run: |
          AAB=androidApp/build/outputs/bundle/release/androidApp-release.aab
          jarsigner -verify "$AAB"
          CERT_ENTRY=$(unzip -Z1 "$AAB" 'META-INF/*.RSA' | head -1)
          unzip -p "$AAB" "$CERT_ENTRY" > "$RUNNER_TEMP/sigcert.rsa"
          FP=$(keytool -printcert -file "$RUNNER_TEMP/sigcert.rsa" | grep -oE 'SHA256: ([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -1)
          echo "AAB signer certificate: $FP"
          EXPECTED='SHA256: 60:4F:67:4A:9D:4B:5B:28:45:D5:09:AF:EB:B7:DA:21:E7:CD:DD:FE:D4:64:04:A1:F9:76:D0:43:61:35:83:77'
          if [ "$FP" != "$EXPECTED" ]; then echo "::error::Fingerprint mismatch: expected $EXPECTED"; exit 1; fi
          echo "AAB is signed with the real Play upload key; fingerprint matches."

      - name: Upload AAB artifact (1 day)
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-aab
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab
          retention-days: 1
